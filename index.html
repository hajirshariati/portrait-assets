<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review AI portrait</title>
<style>body{margin:0;font:14px system-ui,sans-serif}portrait-follow{display:block;position:relative;line-height:0;touch-action:pan-y}portrait-follow img{width:100%;display:block}portrait-follow canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#c{display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px;background:#f4f1eb;line-height:1.4}#c label{display:flex;gap:6px;align-items:center}</style>
<div id="c"><label><input type="checkbox" data-k="flipX">Mirror left/right</label><label><input type="checkbox" data-k="flipY">Mirror up/down</label>
<label>Reach <input type="range" data-k="reach" min="0.2" max="2" step="0.1" value="0.6"><output>0.6</output></label>
<label>Motion amount <input type="range" data-k="intensity" min="0.2" max="1" step="0.1" value="1"><output>1</output></label><span id="s"></span></div>
<portrait-follow data-manifest="./manifest.json" data-debug><img src="source.jpg" alt="Portrait preview"><canvas hidden></canvas></portrait-follow>
<script src="player.js"></script>
<script>const el=document.querySelector('portrait-follow');for(const i of document.querySelectorAll('#c input')){const set=()=>{el.dataset[i.dataset.k]=i.type==='checkbox'?String(i.checked):i.value;if(i.nextElementSibling)i.nextElementSibling.value=i.value};i.addEventListener('input',set);set()}
fetch('manifest.json').then(r=>r.json()).then(m=>{document.getElementById('s').textContent=`grid ${m.yaw.length}x${m.pitch.length}, yawSign ${m.yawSign??'default'}, pitchSign ${m.pitchSign??'default'}`})</script>
